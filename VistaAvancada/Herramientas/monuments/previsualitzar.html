<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Previsualització de monuments</title>
<!-- Eina de desenvolupament (no forma part de l'aplicació). Cal servir la carpeta VistaAvancada/ amb un servidor local.
     Paràmetres:
       fitxer=dades_0          fitxer de dades (web/js/monuments/<fitxer>.js)
       ciutat=Barcelona&m=0    monument a mostrar (índex dins la ciutat); sense ciutat: el primer
       vista=obliqua|dalt      càmera obliqua (per defecte) o zenital (per comprovar la planta sobre el satèl·lit)
       az=210                  azimut de la càmera en graus (d'on mira: 0 = des del nord)
       dist=1.0                multiplicador de distància de la càmera
       sat=0                   sense imatge de satèl·lit a terra
       z=17                    zoom de les tessel·les de satèl·lit (16..18)
       tot=1                   graella amb tots els monuments del fitxer (sense satèl·lit)
       validar=1               només escriu un informe de validació al text de la pàgina (per a --dump-dom) -->
<script type="importmap">{"imports":{"three":"/web/lib/three.module.min.js","three/addons/":"/web/lib/addons/"}}</script>
<style>
  html, body { margin: 0; height: 100%; background: #1d2a38; overflow: hidden; font: 13px "Segoe UI", sans-serif; color: #fff; }
  canvas { display: block; }
  #info { position: fixed; left: 10px; top: 10px; background: rgba(0,0,0,.6); padding: 8px 12px; border-radius: 6px; white-space: pre; font: 12px Consolas, monospace; }
  #informe { white-space: pre; font: 12px Consolas, monospace; padding: 10px; }
</style>
</head>
<body>
<div id="info">Carregant…</div>
<div id="informe"></div>
<script type="module">
import * as THREE from 'three';
import { construirGeometria, crearMaterialMonument, validarCiutats } from '/web/js/monuments_geo.js';

const q = new URLSearchParams(location.search);
const fitxer = q.get('fitxer') || 'dades_0';
const info = document.getElementById('info');

function escriu(t) { document.getElementById('informe').textContent += t + '\n'; }

async function principal() {
  let CIUTATS;
  try { ({ CIUTATS } = await import(`/web/js/monuments/${fitxer}.js`)); }
  catch (e) { info.textContent = 'ERROR en importar el fitxer: ' + e.message; escriu('ERROR IMPORT: ' + e.message); return; }

  if (q.has('validar')) {
    info.remove();
    const errs = validarCiutats(CIUTATS);
    let total = 0;
    for (const c of CIUTATS) for (const m of c.monuments) {
      const r = construirGeometria(m.peces); total++;
      const b = r.caixa;
      escriu(`${c.ciutat.padEnd(18)} ${m.nom.padEnd(34)} ${String(r.triangles).padStart(5)} tri  ` +
        (b ? `${(b.max.x - b.min.x).toFixed(0)}x${(b.max.z - b.min.z).toFixed(0)} m, alt ${b.max.y.toFixed(0)} m` : '') +
        `  (${m.lat}, ${m.lon}) rumb ${m.rumb || 0}`);
      r.geo.dispose();
    }
    escriu(`\nCiutats: ${CIUTATS.length} · monuments: ${total}`);
    escriu(errs.length ? 'ERRORS:\n' + errs.join('\n') : 'VALIDACIO OK');
    return;
  }

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  const escena = new THREE.Scene();
  escena.background = new THREE.Color(0x9cc3e6);
  const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 20000);
  const mat = crearMaterialMonument();

  if (q.has('tot')) {
    // Graella amb tots els monuments
    const llista = [];
    for (const c of CIUTATS) for (const m of c.monuments) llista.push({ c, m });
    const n = Math.ceil(Math.sqrt(llista.length)), pas = 420;
    llista.forEach(({ c, m }, k) => {
      const r = construirGeometria(m.peces);
      const mesh = new THREE.Mesh(r.geo, mat);
      mesh.position.set((k % n - (n - 1) / 2) * pas, 0, Math.floor(k / n) * pas - (n - 1) / 2 * pas);
      escena.add(mesh);
    });
    const terra = new THREE.Mesh(new THREE.PlaneGeometry(n * pas + 400, n * pas + 400), new THREE.MeshBasicMaterial({ color: 0x6f8a5c }));
    terra.rotation.x = -Math.PI / 2; escena.add(terra);
    const d = n * pas * 0.95;
    cam.position.set(-d * 0.55, d * 0.6, d * 0.75); cam.lookAt(0, 0, 0);
    info.textContent = `${fitxer}: ${llista.length} monuments`;
    renderer.render(escena, cam);
    return;
  }

  const c = CIUTATS.find(x => x.ciutat === q.get('ciutat')) || CIUTATS[0];
  const m = c.monuments[+(q.get('m') || 0)] || c.monuments[0];
  const r = construirGeometria(m.peces);
  const mesh = new THREE.Mesh(r.geo, mat);
  mesh.rotation.y = -(m.rumb || 0) * Math.PI / 180;
  mesh.position.y = 0.3;
  escena.add(mesh);
  const b = r.caixa, mida = Math.max(b.max.x - b.min.x, b.max.z - b.min.z, b.max.y);
  info.textContent = `${c.ciutat} · ${m.nom}\nlat ${m.lat}  lon ${m.lon}  rumb ${m.rumb || 0}\n` +
    `${r.triangles} triangles · ${(b.max.x - b.min.x).toFixed(0)} x ${(b.max.z - b.min.z).toFixed(0)} m (model sense girar) · alçada ${b.max.y.toFixed(0)} m` +
    (r.errors.length ? '\nERRORS:\n' + r.errors.join('\n') : '');

  // Terra amb tessel·les de satèl·lit (Esri World Imagery) perquè el centre (lat, lon) quedi a l'origen
  if (q.get('sat') !== '0') {
    const z = +(q.get('z') || (mida > 400 ? 16 : 17));
    const N = 5, T = 256, n2 = 2 ** z;
    const lat = m.lat * Math.PI / 180;
    const px = (m.lon + 180) / 360 * T * n2;
    const py = (1 - Math.asinh(Math.tan(lat)) / Math.PI) / 2 * T * n2;
    const tx0 = Math.floor(px / T) - 2, ty0 = Math.floor(py / T) - 2;
    const cv = document.createElement('canvas'); cv.width = cv.height = N * T;
    const g = cv.getContext('2d');
    await Promise.all(Array.from({ length: N * N }, (_, k) => new Promise(res => {
      const img = new Image(); img.crossOrigin = 'anonymous';
      img.onload = () => { g.drawImage(img, (k % N) * T, Math.floor(k / N) * T); res(); };
      img.onerror = () => res();
      img.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${ty0 + Math.floor(k / N)}/${tx0 + k % N}`;
    })));
    const mpp = 156543.03392 * Math.cos(lat) / n2;            // metres per píxel
    const tex = new THREE.CanvasTexture(cv);
    const terra = new THREE.Mesh(new THREE.PlaneGeometry(N * T * mpp, N * T * mpp), new THREE.MeshBasicMaterial({ map: tex }));
    terra.rotation.x = -Math.PI / 2;
    terra.position.set((tx0 * T + N * T / 2 - px) * mpp, 0, (ty0 * T + N * T / 2 - py) * mpp);
    escena.add(terra);
    // Creu vermella al punt (lat, lon) del monument i fletxa cap al nord
    const creu = new THREE.Mesh(new THREE.BoxGeometry(mida * 0.6, 0.5, 1.2), new THREE.MeshBasicMaterial({ color: 0xff2030 }));
    creu.position.y = 0.6; escena.add(creu);
    const creu2 = creu.clone(); creu2.rotation.y = Math.PI / 2; escena.add(creu2);
    const nord = new THREE.Mesh(new THREE.ConeGeometry(mida * 0.03, mida * 0.1, 3), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
    nord.rotation.x = -Math.PI / 2; nord.position.set(0, 1, -mida * 0.55); escena.add(nord);
  } else {
    const terra = new THREE.Mesh(new THREE.PlaneGeometry(mida * 4, mida * 4), new THREE.MeshBasicMaterial({ color: 0x7b9467 }));
    terra.rotation.x = -Math.PI / 2; escena.add(terra);
  }

  const vista = q.get('vista') || 'obliqua';
  const az = (+(q.get('az') ?? 210)) * Math.PI / 180, dist = mida * 1.9 * +(q.get('dist') || 1);
  const centreY = vista === 'dalt' ? 0 : b.max.y * 0.35;
  if (vista === 'dalt') { cam.position.set(0, dist * 1.25, 0.001); cam.up.set(0, 0, -1); }
  else cam.position.set(Math.sin(az) * dist * 0.8, dist * 0.55, -Math.cos(az) * dist * 0.8);   // az des del nord (−Z)
  cam.lookAt(0, centreY, 0);
  // Sol des del sud-oest, alt
  cam.updateMatrixWorld();
  const sol = new THREE.Vector3(-0.5, 0.8, 0.45).normalize().transformDirection(cam.matrixWorldInverse);
  mat.uniforms.uSolV.value.copy(sol);
  mat.uniforms.uAmuntV.value.set(0, 1, 0).transformDirection(cam.matrixWorldInverse);
  renderer.render(escena, cam);
}
principal().catch(e => { info.textContent = 'ERROR: ' + (e.stack || e); escriu('ERROR: ' + e.message); });
</script>
</body>
</html>
